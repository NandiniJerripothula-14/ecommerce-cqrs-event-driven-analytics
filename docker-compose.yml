services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: write_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - ./db/init-write.sql:/docker-entrypoint-initdb.d/init-write.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d write_db"]
      interval: 10s
      timeout: 5s
      retries: 10
  read-db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: read_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - ./db/init-read.sql:/docker-entrypoint-initdb.d/init-read.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d read_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  broker:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  command-service:
    build: ./command-service
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://user:password@db:5432/write_db
      BROKER_URL: amqp://guest:guest@broker:5672/
      OUTBOX_POLL_INTERVAL_MS: 2000
      OUTBOX_BATCH_SIZE: 50
      EXCHANGE_NAME: ecommerce.events
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  consumer-service:
    build: ./consumer-service
    depends_on:
      broker:
        condition: service_healthy
      read-db:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@broker:5672/
      READ_DATABASE_URL: postgresql://user:password@read-db:5432/read_db
      EXCHANGE_NAME: ecommerce.events
      QUEUE_NAME: analytics.readmodel
      DLQ_EXCHANGE: ecommerce.dlx
      DLQ_QUEUE: analytics.readmodel.dlq
      MAX_RETRIES: 3
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  query-service:
    build: ./query-service
    ports:
      - '8081:8081'
    depends_on:
      read-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      PORT: 8081
      READ_DATABASE_URL: postgresql://user:password@read-db:5432/read_db
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
